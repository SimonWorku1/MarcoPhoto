name: Daily commit

on:
  schedule:
    # 16:30 UTC daily (~8:30am US Pacific)
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Append timestamped line to log
        run: |
          mkdir -p logs
          echo "Daily update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/daily.log

      - name: Commit and push if there are changes
        run: |
          git config user.name "Simon Worku"
          git config user.email "143561285+SimonWorku1@users.noreply.github.com"
          git add -f logs/daily.log
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily update: $(date -u '+%Y-%m-%d')"
          git push origin HEAD:${GITHUB_REF_NAME}
