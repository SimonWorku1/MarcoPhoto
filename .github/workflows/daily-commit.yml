name: Daily commit

on:
  schedule:
    # 16:30 UTC daily (~8:30am US Pacific)
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make a random number of commits (1-5) and push
        run: |
          git config user.name "Simon Worku"
          git config user.email "143561285+SimonWorku1@users.noreply.github.com"
          mkdir -p logs

          # Random count between 1 and 5 (inclusive)
          COUNT=$(( (RANDOM % 5) + 1 ))
          echo "Making $COUNT commit(s) today"

          made=0
          for i in $(seq 1 "$COUNT"); do
            # Unique line per commit so each has real staged changes
            echo "Daily update: $(date -u '+%Y-%m-%d %H:%M:%S UTC') (#$i of $COUNT)" >> logs/daily.log
            git add -f logs/daily.log
            if git diff --cached --quiet; then
              echo "No changes for commit #$i, skipping."
              continue
            fi
            git commit -m "Daily update: $(date -u '+%Y-%m-%d') (#$i)"
            made=$((made + 1))
          done

          if [ "$made" -gt 0 ]; then
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "Pushed $made commit(s)."
          else
            echo "No changes to commit."
          fi
